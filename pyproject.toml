[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "scout"
version = "0.1.0"
description = "Find, vet and package TESS transit candidates missed by SPOC and QLP"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Jurgen Kobierczynski" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0",
    "pyarrow>=14",
    "wotan>=1.10",
    "transitleastsquares>=1.32",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# MAST access (light curves, TIC, Gaia DR3 for vetting). Not needed for tests
# or for working on already-cached data.
mast = ["astroquery>=0.4.7", "pyvo>=1.4"]
# Physical (limb-darkened) transit models for synthetic data and injection.
# Without it the generator falls back to a trapezoid model; `scout vet` needs it.
models = ["batman-package>=2.4.9"]
# False-positive probabilities (`scout fpp`). TRICERATOPS needs lightkurve,
# which does not build on Python 3.13: use a 3.11/3.12 environment for it.
# It also holds NumPy below 2 there, which recent pyarrow no longer supports.
fpp = [
    "triceratops>=1.1; python_version < '3.13'",
    "pyarrow>=14,<20; python_version < '3.13'",
    "pyvo>=1.4",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
scout = "scout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters and × in docstrings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: longer tests (TLS on synthetic multi-sector data)",
    "network: needs MAST access; skipped unless SCOUT_NETWORK_TESTS=1",
]
