name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        extras: ["dev,models"]
        include:
          # Without batman: exercises the trapezoid fallback in the generator.
          - python-version: "3.12"
            extras: "dev"
    name: test (py${{ matrix.python-version }}, ${{ matrix.extras }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[${{ matrix.extras }}]"
      # Unit tests plus the small synthetic injection-recovery suite (marked slow).
      # No MAST access needed.
      - run: pytest -m "not network"
